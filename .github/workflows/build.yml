name: Build Android Updater

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Create release signing key
        shell: bash
        run: |
          mkdir -p signing
          SIGNING_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -v -storetype JKS -keystore signing/dim5lBOT-Android-Updater.jks -storepass "$SIGNING_PASSWORD" -keypass "$SIGNING_PASSWORD" -alias dim5lbot-updater -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=dim5lBOT Android Updater, O=dim5lBOT, C=KR"
          {
            echo "alias=dim5lbot-updater"
            echo "store_password=$SIGNING_PASSWORD"
            echo "key_password=$SIGNING_PASSWORD"
          } > signing/signing-info.txt
          echo "SIGNING_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: >
          gradle assembleRelease --no-daemon
          -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signing/dim5lBOT-Android-Updater.jks"
          -Pandroid.injected.signing.store.password="$SIGNING_PASSWORD"
          -Pandroid.injected.signing.key.alias=dim5lbot-updater
          -Pandroid.injected.signing.key.password="$SIGNING_PASSWORD"
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk dim5lBOT-Android-Updater.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dim5lBOT-Android-Updater
          path: dim5lBOT-Android-Updater.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dim5lBOT-Android-Updater-Signing-Key
          path: signing/
          if-no-files-found: error
          retention-days: 7
