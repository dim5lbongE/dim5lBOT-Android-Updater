name: Build Android Updater

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore release signing key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p signing
          test -n "$SIGNING_KEY_BASE64"
          echo "$SIGNING_KEY_BASE64" | base64 --decode > signing/dim5lBOT-Android-Updater.jks
          echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: >
          gradle assembleRelease --no-daemon
          -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signing/dim5lBOT-Android-Updater.jks"
          -Pandroid.injected.signing.store.password="$SIGNING_STORE_PASSWORD"
          -Pandroid.injected.signing.key.alias=dim5lbot-updater
          -Pandroid.injected.signing.key.password="$SIGNING_KEY_PASSWORD"
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk dim5lBOT-Android-Updater.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dim5lBOT-Android-Updater
          path: dim5lBOT-Android-Updater.apk
          if-no-files-found: error
