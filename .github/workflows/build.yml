name: Build Android Updater

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore release signing key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p signing
          gh api repos/${{ github.repository }}/actions/artifacts/10376112289/zip > signing-key.zip
          unzip -q signing-key.zip -d signing
          SIGNING_STORE_PASSWORD="$(sed -n 's/^store_password=//p' signing/signing-info.txt)"
          SIGNING_KEY_PASSWORD="$(sed -n 's/^key_password=//p' signing/signing-info.txt)"
          echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: >
          gradle assembleRelease --no-daemon
          -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signing/dim5lBOT-Android-Updater.jks"
          -Pandroid.injected.signing.store.password="$SIGNING_STORE_PASSWORD"
          -Pandroid.injected.signing.key.alias=dim5lbot-updater
          -Pandroid.injected.signing.key.password="$SIGNING_KEY_PASSWORD"
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk dim5lBOT-Android-Updater.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dim5lBOT-Android-Updater
          path: dim5lBOT-Android-Updater.apk
          if-no-files-found: error
